spring.application.name=ParticipaUrbano

spring.datasource.url=jdbc:mysql://localhost:3306/participa_urbano?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MinIO configuration
minio.url=http://127.0.0.1:9000
minio.access-key=admin
minio.secret-key=admin123
minio.bucket-name=participa-urbano
